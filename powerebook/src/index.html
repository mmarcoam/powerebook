<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Ebook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">🚀 Power Ebook</div>
        <div class="controls" id="header-controls">
            <button class="btn btn-primary" id="scan-btn">🔍 Escanear Pasta</button>
        </div>
        <button class="btn btn-secondary hidden" id="back-btn">← Voltar à Biblioteca</button>
    </header>

    <main class="main-content">
        <!-- TELA 1: BIBLIOTECA -->
        <div id="library-view">
            <h2 class="section-title">Sua Biblioteca</h2>
            <div class="library-grid" id="library">
                <p style="color: #aaa; grid-column: 1/-1; text-align: center;">Clique em "Escanear Pasta" para começar.</p>
            </div>
        </div>

        <!-- TELA 2: LEITOR -->
        <div id="reader-view" class="hidden">
            <div class="reader-container">
                <h2 id="reader-title" class="reader-title">Título do Livro</h2>
                <div id="epub-area" style="width: 100%; height: 600px; background: #2a2a2a; border-radius: 8px;"></div>
            </div>
        </div>
    </main>

    <!-- O SEGREDO: type="module" diz ao empacotador para carregar o cérebro corretamente -->
    <script type="module" src="main.js"></script>
</body>
</html>
